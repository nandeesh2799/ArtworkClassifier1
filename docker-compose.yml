version: '3.8'

services:
  artwork-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artwork-classifier-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
